<div class="d-flex justify-content-center">
  <div class="col-8">
    <h2 id="jhi-student-heading" data-cy="StudentCreateUpdateHeading" jhiTranslate="global.menu.modules.enrollmentForm">Enrollment Form</h2>

    <jhi-alert-error />
    <jhi-alert />

    <jhi-search-card (studentOutputFilter)="studentOutputFilterEvent($event)" />

    <div class="row mt-3">
      <div class="col-4">
        <jhi-student [source]="source" [studentInputFilter]="studentFilter" />
      </div>
      <div class="col-8">
        <jhi-student-detail [source]="source" [student]="selectedStudent" />
      </div>
    </div>
  </div>
</div>
