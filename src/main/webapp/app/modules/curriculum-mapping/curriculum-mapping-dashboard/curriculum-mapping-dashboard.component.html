<div class="d-flex justify-content-center">
  <div class="col">
    <h2 data-cy="curriculumMappingDashboardHeading" class="d-print-none">
      <span jhiTranslate="schInfoSysApp.curriculumMappingDashboard.home.title">Curriculum Mapping Dashboard</span>
    </h2>

    <hr class="d-print-none" />

    <jhi-alert-error />

    <jhi-alert />

    <div class="d-print-none shadow-sm py-2 pb-3 mb-sm-3 bg-body-tertiary rounded-4 row col-sm-6">
      <label for="field_course" class="visually-hidden">Search Course</label>
      <div class="input-group">
        <input
          type="text"
          class="form-control rounded-4"
          name="course"
          id="field_course"
          data-cy="course"
          placeholder="Search Course"
          aria-label="Search Course"
          [(ngModel)]="this.curriculumMappingService.selectedCourse"
          [ngbTypeahead]="curriculumMappingService.search"
          [inputFormatter]="curriculumMappingService.formatter"
          [resultFormatter]="curriculumMappingService.formatter"
          [editable]="false"
          (ngModelChange)="curriculumMappingService.loadCurriculumMappings(this.curriculumMappingService.selectedCourse)"
        />
        <span class="input-group-text border-0"><fa-icon icon="search"></fa-icon></span>
      </div>
    </div>
    @if (this.curriculumMappingService.isLoading()) {
      <div class="d-flex justify-content-center">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    }

    @if (this.curriculumMappingService.selectedCourse) {
      <jhi-course-detail-card [selectedCourse]="this.curriculumMappingService.selectedCourse"></jhi-course-detail-card>

      <div class="row py-2 bg-body-tertiary mb-sm-3">
        <div class="row">
          @if (!this.curriculumMappingService.hasCurMap) {
            <div class="col-sm-12 p-1 fw-bold text-center text-bg-danger">No Curriculum</div>
            <div class="col-sm-12 p-1 text-center">
              <a [routerLink]="['/curriculum-map', this.curriculumMappingService.selectedCourse.id, 1, 'new']"
                >Add Curriculum Map <fa-icon icon="plus"></fa-icon
              ></a>
            </div>
          }

          <jhi-scope-seq-card
            [selectedCourse]="this.curriculumMappingService.selectedCourse"
            [curMapByQuarter]="this.curriculumMappingService.curMapByQuarter"
            [selectedQuarter]="this.curriculumMappingService.selectedQuarter()"
            (selectedQuarterOutput)="this.curriculumMappingService.setSelectedQuarter($event)"
            [hasCurMap]="this.curriculumMappingService.hasCurMap"
          ></jhi-scope-seq-card>

          <jhi-quarter-card
            [selectedCourse]="this.curriculumMappingService.selectedCourse"
            [curMapByQuarter]="this.curriculumMappingService.curMapByQuarter"
            [selectedQuarter]="this.curriculumMappingService.selectedQuarter()"
            [lcMap]="this.curriculumMappingService.lcMap"
            [sMap]="this.curriculumMappingService.sMap"
            [aMap]="this.curriculumMappingService.aMap"
          ></jhi-quarter-card>
        </div>
      </div>
    }
  </div>
</div>
