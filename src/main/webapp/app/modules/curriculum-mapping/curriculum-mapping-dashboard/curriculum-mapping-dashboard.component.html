<div class="d-flex justify-content-center">
  <div class="col">
    <h2 data-cy="curriculumMappingDashboardHeading" class="d-print-none">
      <span jhiTranslate="schInfoSysApp.curriculumMappingDashboard.home.title">Curriculum Mapping Dashboard</span>
    </h2>

    <hr class="d-print-none" />

    <jhi-alert-error></jhi-alert-error>
    <jhi-alert></jhi-alert>

    <div class="d-print-none shadow-sm py-2 pb-3 mb-sm-3 bg-body-tertiary rounded-4 row col-sm-6">
      <label class="form-label col-sm-12" jhiTranslate="schInfoSysApp.curriculumMappingDashboard.searchCourse" for="field_course"
        >searchCourse</label
      >
      <div class="input-group">
        <input
          type="text"
          class="form-control rounded-4"
          name="course"
          id="field_course"
          data-cy="course"
          [(ngModel)]="selectedCourse"
          [ngbTypeahead]="search"
          [inputFormatter]="formatter"
          [resultFormatter]="formatter"
          [editable]="false"
          (ngModelChange)="loadCurriculumMappings(selectedCourse)"
        />
        <span class="input-group-text border-0"><fa-icon icon="search"></fa-icon></span>
      </div>
    </div>
    @if (isLoading) {
      <div class="d-flex justify-content-center">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    }

    @if (selectedCourse) {
      <jhi-course-detail-card [selectedCourse]="selectedCourse"></jhi-course-detail-card>

      <div class="row py-2 bg-body-tertiary mb-sm-3">
        <div class="row">
          @if (!hasCurMap) {
            <div class="col-sm-12 p-1 fw-bold text-center text-bg-danger">No Curriculum</div>
            <div class="col-sm-12 p-1 text-center">
              <a [routerLink]="['/curriculum-map', selectedCourse.id, 1, 'new']">Add Curriculum Map <fa-icon icon="plus"></fa-icon></a>
            </div>
          }

          <jhi-scope-seq-card
            [selectedCourse]="selectedCourse"
            [curMapByQuarter]="curMapByQuarter"
            [selectedQuarter]="selectedQuarter"
            [hasCurMap]="hasCurMap"
          ></jhi-scope-seq-card>

          <jhi-quarter-card
            [selectedCourse]="selectedCourse"
            [curMapByQuarter]="curMapByQuarter"
            [selectedQuarter]="selectedQuarter"
            [lcMap]="lcMap"
            [sMap]="sMap"
            [aMap]="aMap"
          ></jhi-quarter-card>
        </div>
      </div>
    }
  </div>
</div>
