<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="jhi-class-schedule-heading"
        data-cy="ClassScheduleCreateUpdateHeading"
        jhiTranslate="schInfoSysApp.classSchedule.home.createOrEditLabel"
      >
        Create or edit a Class Schedule
      </h2>

      <div>
        <jhi-alert-error />

        @if (editForm.controls.id.value !== null) {
          <div class="mb-3">
            <label class="form-label" for="field_id" jhiTranslate="global.field.id">ID</label>
            <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
          </div>
        }

        @let nameRef = editForm.get('name')!;
        <div class="mb-3">
          <label class="form-label" for="field_name" jhiTranslate="schInfoSysApp.classSchedule.name">Name</label>
          <input type="text" class="form-control" name="name" id="field_name" data-cy="name" formControlName="name" />
          @if (nameRef.invalid && (nameRef.dirty || nameRef.touched)) {
            <div>
              @if (editForm.get('name')?.errors?.maxlength) {
                <small class="form-text text-danger" jhiTranslate="entity.validation.maxlength" [translateValues]="{ max: '20' }"
                  >This field cannot be longer than 20 characters.</small
                >
              }
            </div>
          }
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_gradelevel" jhiTranslate="schInfoSysApp.classSchedule.gradelevel">Gradelevel</label>
          <select
            class="form-control"
            id="field_gradelevel"
            data-cy="gradelevel"
            name="gradelevel"
            formControlName="gradelevel"
            [compareWith]="compareAppConfig"
          >
            <option [ngValue]="null"></option>
            @for (appConfigOption of gradelevelsCollection(); track $index) {
              <option [ngValue]="appConfigOption">{{ appConfigOption.id }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_terms" jhiTranslate="schInfoSysApp.classSchedule.terms">Terms</label>
          <select
            class="form-control"
            id="field_terms"
            data-cy="terms"
            name="terms"
            formControlName="terms"
            [compareWith]="compareAcademicTerms"
          >
            <option [ngValue]="null"></option>
            @for (academicTermsOption of academicTermsesSharedCollection(); track $index) {
              <option [ngValue]="academicTermsOption">{{ academicTermsOption.id }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_year" jhiTranslate="schInfoSysApp.classSchedule.year">Year</label>
          <select
            class="form-control"
            id="field_year"
            data-cy="year"
            name="year"
            formControlName="year"
            [compareWith]="compareAcademicYear"
          >
            <option [ngValue]="null"></option>
            @for (academicYearOption of academicYearsSharedCollection(); track $index) {
              <option [ngValue]="academicYearOption">{{ academicYearOption.id }}</option>
            }
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving()"
          class="btn btn-primary"
        >
          <fa-icon icon="save" />&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
